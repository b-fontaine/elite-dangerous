name: elite_dangerous
description: "Codex Exobiologique — suivi de commandant Elite Dangerous (exploration & exobiologie)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- Presentation / state management (BLoC only, no Cubit) ---
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^2.1.0

  # --- Navigation ---
  go_router: ^17.5.0

  # --- Dependency injection ---
  get_it: ^9.2.1
  injectable: ^3.0.0

  # --- Network (Dio / Retrofit) ---
  dio: ^5.11.0
  retrofit: ^4.10.0
  json_annotation: ^4.12.0

  # --- Local storage (no backend) ---
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0
  path_provider: ^2.1.6

  # --- OAuth2 / PKCE plumbing ---
  crypto: ^3.0.7
  url_launcher: ^6.3.2
  app_links: ^7.2.1

  # --- Misc ---
  collection: ^1.19.1
  intl: ^0.20.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  build_runner: ^2.16.0
  injectable_generator: ^3.1.3
  retrofit_generator: ^10.2.8
  json_serializable: ^6.14.1

  # --- Tests: BDD (Gherkin) + TDD ---
  bdd_widget_test: ^2.1.4
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

  # Le journal vit dans un fichier : les tests qui montent le vrai graphe de
  # dépendances doivent pouvoir substituer `path_provider`.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/guides/
